<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Football Stats{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
  <div class="container-xl">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
      <i class="bi bi-trophy-fill text-warning"></i>
      Football Stats
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-bar-chart-fill me-1"></i>Stats</a></li>
        <li class="nav-item"><a class="nav-link" href="/teams"><i class="bi bi-shield-fill me-1"></i>Teams</a></li>
      </ul>
      <!-- League switcher -->
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          {% if league_code is defined and leagues is defined %}
            {{ leagues[league_code].flag }} {{ leagues[league_code].name }}
          {% else %}
            Select League
          {% endif %}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          {% if leagues is defined %}
            {% for code, info in leagues.items() %}
              <li>
                <a class="dropdown-item {% if league_code is defined and league_code == code %}active{% endif %}"
                   href="{{ request.path }}?league={{ code }}">
                  {{ info.flag }} {{ info.name }}
                </a>
              </li>
            {% endfor %}
          {% endif %}
        </ul>
      </div>
    </div>
  </div>
</nav>

<main class="container-xl py-4">
  {% block content %}{% endblock %}
</main>

<footer class="border-top border-secondary mt-5 py-3 text-center text-muted small">
  Data provided by <a href="https://www.football-data.org" class="text-secondary" target="_blank">football-data.org</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
